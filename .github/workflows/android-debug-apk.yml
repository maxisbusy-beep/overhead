name: Android debug APK

# Builds an installable debug APK on every push to main and attaches it to the
# run as a downloadable artifact. No signing keys and no secrets: a debug APK
# is signed with the public Android debug key, which is enough to sideload.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble the web app into www/
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Cache the Gradle dependency downloads. Maven Central answers a
          # cold runner with HTTP 429 often enough to fail a build; a warm
          # cache mostly sidesteps that, and makes the build quicker.
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the "tools" package was retired
          # by Google and sdkmanager now fails on it. Gradle fetches the
          # platform and build-tools it needs on its own.
          packages: ''

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK after the commit
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$src"
          mkdir -p dist
          cp "$src" "dist/overhead-debug-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: overhead-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
